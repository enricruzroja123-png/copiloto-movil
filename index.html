<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copiloto - Asistente Visual</title>
  <!-- Carga de ONNX Runtime Web desde CDN -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    
    #video-container {
      position: relative;
      width: 100vw;
      height: 70vh;
      overflow: hidden;
      background-color: #1a1a1a;
    }
    
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    canvas {
      display: none;
    }
    
    #controls {
      height: 30vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 20px;
      background-color: #0a0a0a;
    }
    
    button {
      width: 90%;
      max-width: 400px;
      height: 70px;
      font-size: 1.2rem;
      font-weight: bold;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    
    button:hover {
      background-color: #218838;
    }
    
    button:active {
      background-color: #1e7e34;
    }
    
    button:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }
    
    #status {
      font-size: 1.2rem;
      color: #ffc107;
      min-height: 30px;
      font-weight: bold;
    }
    
    #detection-log {
      font-size: 0.9rem;
      color: #87ceeb;
      max-height: 60px;
      overflow-y: auto;
      width: 90%;
      max-width: 400px;
      background-color: #1a1a1a;
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output-canvas"></canvas>
  </div>

  <div id="controls">
    <div id="status">Inicializando...</div>
    <button id="btn-start" onclick="iniciarCopiloto()">INICIAR</button>
    <button id="btn-stop" onclick="detenerCopiloto()" disabled>DETENER</button>
    <div id="detection-log"></div>
  </div>

  <script>
    let session = null;
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output-canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    const detectionLog = document.getElementById('detection-log');
    const btnStart = document.getElementById('btn-start');
    const btnStop = document.getElementById('btn-stop');
    
    let lastSpokenTime = 0;
    let lastSpokenText = "";
    let isRunning = false;
    let detectionInterval = null;

    // Nombres de clases COCO en español
    const classNames = {
      0: 'persona', 1: 'bicicleta', 2: 'coche', 3: 'moto', 5: 'autobús',
      7: 'camión', 9: 'semáforo', 10: 'boca de riego', 11: 'señal de stop',
      13: 'banco', 15: 'perro', 16: 'gato', 17: 'caballo', 18: 'oveja',
      19: 'vaca', 20: 'elefante'
    };

    // Síntesis de voz
    function hablar(texto) {
      const now = Date.now();
      if (texto === lastSpokenText && (now - lastSpokenTime) < 2000) return;

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = 'es-ES';
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);

      lastSpokenText = texto;
      lastSpokenTime = now;
    }

    // Actualizar log de detecciones
    function actualizarLog(texto) {
      const timestamp = new Date().toLocaleTimeString();
      detectionLog.innerHTML = `<strong>${timestamp}:</strong> ${texto}<br>` + detectionLog.innerHTML;
      if (detectionLog.children.length > 5) {
        detectionLog.removeChild(detectionLog.lastChild);
      }
    }

    async function iniciarCopiloto() {
      if (isRunning) return;
      
      statusText.innerText = "Iniciando cámara...";
      hablar("Iniciando copiloto visual");
      btnStart.disabled = true;

      try {
        // Acceder a la cámara
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { 
            facingMode: "environment",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        }).catch(() => {
          return navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        });
        
        video.srcObject = stream;
        video.onloadedmetadata = async () => {
          await video.play();
          
          // Esperar a que el video tenga dimensiones
          setTimeout(async () => {
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;

            statusText.innerText = "Cargando modelo IA...";
            
            try {
              // Cargar modelo
              session = await ort.InferenceSession.create('./yolov8n.onnx', {
                executionProviders: ['wasm'],
              });

              isRunning = true;
              statusText.innerText = "✓ SISTEMA ACTIVO";
              hablar("Sistema listo, escaneando");
              btnStop.disabled = false;
              actualizarLog("Copiloto iniciado");

              // Procesar cada fotograma
              procesarCamara();
            } catch (err) {
              statusText.innerText = "Error modelo: " + err.message;
              hablar("Error al cargar modelo");
              console.error("Error modelo:", err);
              btnStart.disabled = false;
            }
          }, 500);
        };
      } catch (err) {
        statusText.innerText = "Error cámara: " + err.message;
        hablar("Error al acceder a cámara");
        console.error("Error cámara:", err);
        btnStart.disabled = false;
      }
    }

    function detenerCopiloto() {
      isRunning = false;
      session = null;
      statusText.innerText = "Detenido";
      btnStart.disabled = false;
      btnStop.disabled = true;
      
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }
      
      hablar("Copiloto detenido");
      actualizarLog("Sistema detenido");
    }

    async function procesarCamara() {
      if (!isRunning || !session) return;

      try {
        // Dibujar video en canvas
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // Preparar tensor
        const inputTensor = prepararTensor();
        
        // Inferencia
        const feeds = {};
        feeds[session.inputNames[0]] = inputTensor;
        const results = await session.run(feeds);
        
        // Procesar resultados
        const output = results[session.outputNames[0]];
        analizarDetecciones(output.data, output.dims);

        inputTensor.dispose();

        // Siguiente fotograma
        requestAnimationFrame(procesarCamara);
      } catch (err) {
        console.error("Error procesamiento:", err);
      }
    }

    function prepararTensor() {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = 640;
      tempCanvas.height = 640;
      const tempCtx = tempCanvas.getContext('2d');
      
      // Dibujar video escalado
      tempCtx.drawImage(video, 0, 0, 640, 640);
      
      const imgData = tempCtx.getImageData(0, 0, 640, 640).data;
      const float32Data = new Float32Array(640 * 640 * 3);

      // Normalizar imagen RGB
      for (let i = 0; i < 640 * 640; i++) {
        float32Data[i] = imgData[i * 4] / 255.0;                          // R
        float32Data[i + 640 * 640] = imgData[i * 4 + 1] / 255.0;          // G
        float32Data[i + 2 * 640 * 640] = imgData[i * 4 + 2] / 255.0;      // B
      }

      return new ort.Tensor('float32', float32Data, [1, 3, 640, 640]);
    }

    function analizarDetecciones(output, dims) {
      const numPredictions = dims[2] || 8400;
      const numClasses = dims[1] - 4 || 80;
      
      let detectadas = [];

      for (let i = 0; i < Math.min(numPredictions, 8400); i++) {
        let maxScore = 0;
        let classId = -1;

        // Encontrar clase con mayor confianza
        for (let c = 0; c < numClasses; c++) {
          const score = output[(4 + c) * numPredictions + i] || 0;
          if (score > maxScore) {
            maxScore = score;
            classId = c;
          }
        }

        // Si detecta con confianza alta y es una clase conocida
        if (maxScore > 0.5 && classNames[classId]) {
          const x = output[0 * numPredictions + i] || 0;
          const y = output[1 * numPredictions + i] || 0;
          const w = output[2 * numPredictions + i] || 0;
          const h = output[3 * numPredictions + i] || 0;
          const area = w * h;

          detectadas.push({
            nombre: classNames[classId],
            confianza: (maxScore * 100).toFixed(1),
            x: x,
            area: area
          });
        }
      }

      // Procesar detecciones ordenadas por área (proximidad)
      detectadas.sort((a, b) => b.area - a.area);
      
      if (detectadas.length > 0) {
        const obj = detectadas[0];
        if (obj.area > 10000) { // Solo si está suficientemente cerca
          let posicion = "al frente";
          if (obj.x < 213) posicion = "a la izquierda";
          else if (obj.x > 427) posicion = "a la derecha";

          const mensaje = `${obj.nombre} ${posicion}`;
          hablar(mensaje);
          actualizarLog(`Detectado: ${obj.nombre} (${obj.confianza}%) ${posicion}`);
        }
      }
    }
  </script>
</body>
</html>
