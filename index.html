<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Copiloto - Asistente de un Toque</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #121212; font-family: sans-serif; overflow: hidden;
        }
        .pantalla-completa {
            width: 100%; height: 100%; border: none;
            background-color: #1b5e20; color: white;
            font-size: 2.2rem; font-weight: bold; text-align: center;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; padding: 20px; box-sizing: border-box;
            cursor: pointer; transition: background-color 0.2s;
        }
        .pantalla-completa:active { background-color: #0b3010; }
        .subtexto { font-size: 1.1rem; margin-top: 15px; color: #a5d6a7; }
        #webcam { display: none; }
    </style>
</head>
<body>

    <button class="pantalla-completa" id="botonAccion" onclick="gestionarToque()">
        TOQUE LA PANTALLA
        <div class="subtexto" id="instrucciones">PARA ACTIVAR ASISTENCIA DE VOZ</div>
    </button>

    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const boton = document.getElementById('botonAccion');
        const instrucciones = document.getElementById('instrucciones');
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        let streamActivo = null;
        let motorVozDesbloqueado = false;
        const urlBackend = "https://weak-queens-go.loca.lt/analizar_entorno";

        function hablar(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'es-ES';
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                const voces = window.speechSynthesis.getVoices();
                const vozEs = voces.find(v => v.lang.startsWith('es'));
                if (vozEs) utterance.voice = vozEs;
                window.speechSynthesis.speak(utterance);
            } else {
                console.warn("La síntesis de voz no está soportada.");
            }
        }

        function desbloquearMotorVoz() {
            if (!motorVozDesbloqueado) {
                hablar("");
                motorVozDesbloqueado = true;
                console.log("Motor de voz desbloqueado físicamente.");
            }
        }

        async function iniciarCamara() {
            try {
                streamActivo = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                });
                video.srcObject = streamActivo;
            } catch (err) {
                console.error("Error al acceder a la cámara:", err);
                hablar("Error de acceso a la cámara. Por favor permite los permisos.");
            }
        }

        function gestionarToque() {
            desbloquearMotorVoz();
            capturarYEnviar();
        }

        async function capturarYEnviar() {
            boton.style.backgroundColor = "#e65100";
            boton.firstChild.textContent = "PROCESANDO...";
            instrucciones.textContent = "Capturando imagen y consultando IA...";
            hablar("Analizando entorno, por favor espera.");

            if (!streamActivo) {
                await iniciarCamara();
            }

            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(async (blob) => {
                let formData = new FormData();
                formData.append('imagen', blob, 'captura.jpg');

                try {
                    const respuesta = await fetch(urlBackend, {
                        method: 'POST',
                        body: formData
                    });

                    const resultado = await respuesta.json();
                    const respuestaTexto = resultado.mensaje_voz || "Procesamiento completado.";

                    hablar(respuestaTexto);

                    boton.style.backgroundColor = "#1b5e20";
                    boton.firstChild.textContent = "TOQUE LA PANTALLA";
                    instrucciones.textContent = "Para volver a analizar tu entorno";

                } catch (err) {
                    console.error(err);
                    hablar("Problema de red con el servidor central de IA. Reintente de nuevo.");
                    boton.style.backgroundColor = "#d84315";
                    boton.firstChild.textContent = "ERROR DE CONEXIÓN";
                    instrucciones.textContent = "Toca para reintentar de nuevo";
                }
            }, 'image/jpeg');
        }

        window.onload = () => {
            iniciarCamara();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.getVoices();
            }
        };
    </script>
</body>
</html>
