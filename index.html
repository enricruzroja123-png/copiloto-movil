<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Depuración de Voz - Copiloto</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #121212; font-family: sans-serif; 
            color: white; display: flex; flex-direction: column;
        }
        .boton-tocar {
            width: 100%; height: 50vh;
            background-color: #1b5e20; color: white;
            font-size: 2rem; font-weight: bold; text-align: center;
            border: none; cursor: pointer;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-sizing: border-box;
        }
        .boton-tocar:active { background-color: #0b3010; }
        .consola-depuracion {
            width: 100%; height: 50vh;
            background-color: #1e1e1e; border-top: 3px solid #00e676;
            padding: 15px; box-sizing: border-box; overflow-y: auto;
            font-family: monospace; font-size: 13px; line-height: 1.5;
        }
        .log-error { color: #ff5252; }
        .log-success { color: #69f0ae; }
        .log-info { color: #40c4ff; }
    </style>
</head>
<body>

    <button class="boton-tocar" id="btnAccion" onclick="intentarHablar()">
        TOCAR PANTALLA
        <div style="font-size: 1rem; margin-top: 10px; color: #a5d6a7;">Para desbloquear audio y hablar</div>
    </button>

    <div class="consola-depuracion" id="consola">
        <span class="log-info">[Consola de Diagnóstico Iniciada]</span><br>
    </div>

    <script>
        const consola = document.getElementById('consola');
        let motorListo = false;

        function log(msg, tipo = 'info') {
            const div = document.createElement('div');
            div.className = 'log-' + tipo;
            div.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
            consola.appendChild(div);
            consola.scrollTop = consola.scrollHeight;
        }

        // Monitorear compatibilidad del navegador
        window.onload = () => {
            if ('speechSynthesis' in window) {
                log("✓ speechSynthesis detectado en el navegador móvil.", "success");
                
                // Cargar voces de forma asíncrona
                window.speechSynthesis.onvoiceschanged = () => {
                    const voces = window.speechSynthesis.getVoices();
                    log(`✓ Voces cargadas: ${voces.length} disponibles.`, "success");
                    const vocesEs = voces.filter(v => v.lang.startsWith('es'));
                    if (vocesEs.length > 0) {
                        log(`Voces en español encontradas: ${vocesEs.length}`, "success");
                        vocesEs.forEach(v => log(`- ${v.name} (${v.lang})`, "info"));
                    } else {
                        log("⚠ No se encontraron voces nativas en español. Se usará el motor por defecto.", "error");
                    }
                };
                
                // Forzar gatillo manual para iOS
                window.speechSynthesis.getVoices();
            } else {
                log("❌ Tu navegador móvil NO soporta speechSynthesis. Intenta con Chrome o Safari actualizado.", "error");
            }
        };

        function intentarHablar() {
            log("👉 Click/Toque detectado. Iniciando ciclo de desbloqueo de voz...", "info");
            
            if (!('speechSynthesis' in window)) {
                log("❌ Abortando: speechSynthesis no soportado.", "error");
                return;
            }

            try {
                window.speechSynthesis.cancel();
                
                const textoPrueba = "Hola, audio desbloqueado correctamente en tu dispositivo móvil.";
                const utterance = new SpeechSynthesisUtterance(textoPrueba);
                utterance.lang = 'es-ES';
                utterance.rate = 1.0;
                utterance.pitch = 1.0;

                // Intentar enlazar voz en español
                const voces = window.speechSynthesis.getVoices();
                const vozEs = voces.find(v => v.lang.startsWith('es'));
                if (vozEs) {
                    utterance.voice = vozEs;
                    log(`Usando voz seleccionada: ${vozEs.name}`, "success");
                }

                utterance.onstart = () => {
                    log("🔊 ¡ÉXITO! El navegador ha comenzado a emitir el audio de forma física.", "success");
                };

                utterance.onerror = (event) => {
                    log(`❌ Error de síntesis: ${event.error}`, "error");
                };

                window.speechSynthesis.speak(utterance);
                log("Comando speak enviado al sistema operativo del celular...", "info");

            } catch (err) {
                log(`❌ Excepción capturada: ${err.message}`, "error");
            }
        }
    </script>
</body>
</html>
