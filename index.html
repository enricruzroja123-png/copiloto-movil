<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copiloto - Asistente Visual</title>
  <!-- Carga de ONNX Runtime Web desde CDN -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    
    #video-container {
      position: relative;
      width: 100vw;
      height: 70vh;
      overflow: hidden;
      background-color: #1a1a1a;
    }
    
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    canvas {
      display: none;
    }
    
    #controls {
      height: 30vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 20px;
      background-color: #0a0a0a;
    }
    
    button {
      width: 90%;
      max-width: 400px;
      height: 70px;
      font-size: 1.2rem;
      font-weight: bold;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    
    button:hover:not(:disabled) {
      background-color: #218838;
    }
    
    button:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }
    
    #status {
      font-size: 1.2rem;
      color: #ffc107;
      min-height: 30px;
      font-weight: bold;
    }
    
    #detection-log {
      font-size: 0.9rem;
      color: #87ceeb;
      max-height: 80px;
      overflow-y: auto;
      width: 90%;
      max-width: 400px;
      background-color: #1a1a1a;
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output-canvas"></canvas>
  </div>

  <div id="controls">
    <div id="status">Inicializando...</div>
    <button id="btn-start" onclick="iniciarCopiloto()">INICIAR</button>
    <button id="btn-stop" onclick="detenerCopiloto()" disabled>DETENER</button>
    <div id="detection-log"></div>
  </div>

  <script>
    let session = null;
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output-canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    const detectionLog = document.getElementById('detection-log');
    const btnStart = document.getElementById('btn-start');
    const btnStop = document.getElementById('btn-stop');
    
    let lastSpokenTime = 0;
    let lastSpokenText = "";
    let isRunning = false;
    let frameCount = 0;
    let processingFrame = false;
    let lastDetectionTime = 0;

    // Nombres de clases COCO en español
    const classNames = {
      0: 'persona', 1: 'bicicleta', 2: 'coche', 3: 'moto', 5: 'autobús',
      7: 'camión', 9: 'semáforo', 10: 'boca de riego', 11: 'señal de stop',
      13: 'banco', 15: 'perro', 16: 'gato', 17: 'caballo', 18: 'oveja',
      19: 'vaca', 20: 'elefante'
    };

    // Síntesis de voz
    function hablar(texto) {
      const now = Date.now();
      if (texto === lastSpokenText && (now - lastSpokenTime) < 2500) return;

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = 'es-ES';
      utterance.rate = 1.0;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);

      lastSpokenText = texto;
      lastSpokenTime = now;
    }

    // Actualizar log de detecciones
    function actualizarLog(texto) {
      const timestamp = new Date().toLocaleTimeString();
      const logEntry = document.createElement('div');
      logEntry.innerHTML = `<strong>${timestamp}:</strong> ${texto}`;
      detectionLog.insertBefore(logEntry, detectionLog.firstChild);
      
      // Mantener solo los últimos 5
      while (detectionLog.children.length > 5) {
        detectionLog.removeChild(detectionLog.lastChild);
      }
    }

    async function iniciarCopiloto() {
      if (isRunning) return;
      
      statusText.innerText = "Iniciando cámara...";
      hablar("Iniciando copiloto visual");
      btnStart.disabled = true;

      try {
        // Acceder a la cámara
        const constraints = {
          video: { 
            facingMode: { ideal: "environment" },
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints)
          .catch(() => navigator.mediaDevices.getUserMedia({ video: true, audio: false }));
        
        video.srcObject = stream;
        
        // Esperar a que el video esté listo
        await new Promise((resolve) => {
          video.onloadedmetadata = () => {
            video.play();
            resolve();
          };
          setTimeout(resolve, 2000); // Timeout de seguridad
        });

        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;

        statusText.innerText = "Cargando modelo IA...";
        
        // Cargar modelo ONNX
        try {
          session = await ort.InferenceSession.create('./yolov8n.onnx', {
            executionProviders: ['wasm'],
          });

          isRunning = true;
          frameCount = 0;
          statusText.innerText = "✓ SISTEMA ACTIVO";
          hablar("Sistema listo");
          btnStop.disabled = false;
          actualizarLog("Copiloto iniciado correctamente");

          // Iniciar procesamiento
          procesarCamara();
        } catch (modelErr) {
          statusText.innerText = "Error modelo: " + modelErr.message;
          hablar("Error al cargar modelo");
          console.error("Error modelo:", modelErr);
          btnStart.disabled = false;
        }
      } catch (err) {
        statusText.innerText = "Error: " + err.message;
        console.error("Error:", err);
        btnStart.disabled = false;
      }
    }

    function detenerCopiloto() {
      isRunning = false;
      if (session) {
        session.release?.();
        session = null;
      }
      statusText.innerText = "Detenido";
      btnStart.disabled = false;
      btnStop.disabled = true;
      
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }
      
      hablar("Copiloto detenido");
      actualizarLog("Sistema detenido");
    }

    async function procesarCamara() {
      if (!isRunning || !session || processingFrame) {
        requestAnimationFrame(procesarCamara);
        return;
      }

      processingFrame = true;

      try {
        // Procesar cada 3 frames (optimización)
        frameCount++;
        if (frameCount % 3 !== 0) {
          processingFrame = false;
          requestAnimationFrame(procesarCamara);
          return;
        }

        // Dibujar video en canvas
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // Preparar tensor
        const inputTensor = prepararTensor();
        if (!inputTensor) throw new Error("No se pudo crear tensor");
        
        // Inferencia
        const feeds = {};
        feeds[session.inputNames[0]] = inputTensor;
        
        const results = await session.run(feeds);
        
        // Procesar resultados
        if (results && session.outputNames && session.outputNames[0]) {
          const output = results[session.outputNames[0]];
          if (output && output.data) {
            analizarDetecciones(output.data, output.dims);
          }
        }

        // Liberar memoria
        inputTensor.dispose();

      } catch (err) {
        console.error("Error procesamiento:", err);
        if (frameCount % 30 === 0) {
          actualizarLog("Error: " + err.message.substring(0, 30));
        }
      } finally {
        processingFrame = false;
        requestAnimationFrame(procesarCamara);
      }
    }

    function prepararTensor() {
      try {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = 640;
        tempCanvas.height = 640;
        const tempCtx = tempCanvas.getContext('2d');
        
        // Dibujar video escalado
        tempCtx.drawImage(video, 0, 0, 640, 640);
        
        const imgData = tempCtx.getImageData(0, 0, 640, 640).data;
        const float32Data = new Float32Array(640 * 640 * 3);

        // Normalizar imagen RGB
        for (let i = 0; i < 640 * 640; i++) {
          float32Data[i] = imgData[i * 4] / 255.0;                          // R
          float32Data[i + 640 * 640] = imgData[i * 4 + 1] / 255.0;          // G
          float32Data[i + 2 * 640 * 640] = imgData[i * 4 + 2] / 255.0;      // B
        }

        return new ort.Tensor('float32', float32Data, [1, 3, 640, 640]);
      } catch (err) {
        console.error("Error preparando tensor:", err);
        return null;
      }
    }

    function analizarDetecciones(output, dims) {
      try {
        const numPredictions = dims[2] || 8400;
        const numClasses = (dims[1] - 4) || 80;
        
        let detectadas = [];

        for (let i = 0; i < Math.min(numPredictions, 8400); i++) {
          let maxScore = 0;
          let classId = -1;

          // Encontrar clase con mayor confianza
          for (let c = 0; c < Math.min(numClasses, 80); c++) {
            const idx = (4 + c) * numPredictions + i;
            if (idx < output.length) {
              const score = output[idx] || 0;
              if (score > maxScore) {
                maxScore = score;
                classId = c;
              }
            }
          }

          // Si detecta con confianza alta y es una clase conocida
          if (maxScore > 0.5 && classNames[classId]) {
            const x = output[0 * numPredictions + i] || 0;
            const w = output[2 * numPredictions + i] || 0;
            const h = output[3 * numPredictions + i] || 0;
            const area = w * h;

            detectadas.push({
              nombre: classNames[classId],
              confianza: (maxScore * 100).toFixed(1),
              x: x,
              area: area
            });
          }
        }

        // Procesar detecciones ordenadas por área (proximidad)
        detectadas.sort((a, b) => b.area - a.area);
        
        if (detectadas.length > 0) {
          const obj = detectadas[0];
          const now = Date.now();
          
          if (obj.area > 10000 && (now - lastDetectionTime) > 2000) {
            let posicion = "al frente";
            if (obj.x < 213) posicion = "a la izquierda";
            else if (obj.x > 427) posicion = "a la derecha";

            const mensaje = `${obj.nombre} ${posicion}`;
            hablar(mensaje);
            actualizarLog(`${obj.nombre} (${obj.confianza}%) ${posicion}`);
            lastDetectionTime = now;
          }
        }
      } catch (err) {
        console.error("Error analizando detecciones:", err);
      }
    }

    // Inicializar estado
    statusText.innerText = "Listo. Presiona INICIAR";
  </script>
</body>
</html>
