<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copiloto1 - Asistente Visual</title>
  <!-- Carga de ONNX Runtime Web desde CDN o cache local -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
    }
    #video-container {
      position: relative;
      width: 100vw;
      height: 70vh;
      overflow: hidden;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #controls {
      height: 30vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }
    button {
      width: 80%;
      height: 60px;
      font-size: 1.3rem;
      font-weight: bold;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 10px;
    }
    #status {
      font-size: 1.1rem;
      color: #ffc107;
    }
  </style>
</head>
<body>

  <div id="video-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output-canvas"></canvas>
  </div>

  <div id="controls">
    <div id="status">Cargando sistema...</div>
    <button id="btn-start" onclick="iniciarCopiloto()">INICIAR ASISTENTE DE VOZ</button>
  </div>

  <script>
    let session = null;
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output-canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    let lastSpokenTime = 0;
    let lastSpokenText = "";

    // Nombres de clases COCO en español para lectura de voz
    const classNames = {
      0: 'persona', 1: 'bicicleta', 2: 'coche', 3: 'moto', 5: 'autobús',
      7: 'camión', 9: 'semáforo', 10: 'boca de riego', 11: 'señal de stop',
      13: 'banco'
    };

    // Configurar síntesis de voz del teléfono
    function hablar(texto) {
      const now = Date.now();
      // Evitar repetir la misma palabra continuamente (esperar mínimo 2.5s)
      if (texto === lastSpokenText && (now - lastSpokenTime) < 2500) return;

      window.speechSynthesis.cancel(); // Cancelar voz anterior si hay retraso
      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = 'es-ES';
      utterance.rate = 1.1; // Velocidad ligeramente rápida para avisos fluidos
      window.speechSynthesis.speak(utterance);

      lastSpokenText = texto;
      lastSpokenTime = now;
    }

    async function iniciarCopiloto() {
      statusText.innerText = "Iniciando cámara y modelo...";
      hablar("Iniciando copiloto visual");

      try {
        // 1. Acceder a la cámara trasera del teléfono
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } },
          audio: false
        }).catch(() => {
          // Si no hay cámara trasera especifica, usar la predeterminada
          return navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        });
        
        video.srcObject = stream;
        await video.play();

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        // 2. Cargar el modelo ONNX en la memoria del teléfono
        statusText.innerText = "Cargando IA en el móvil...";
        session = await ort.InferenceSession.create('./yolov8n.onnx', {
          executionProviders: ['webgl', 'wasm']
        });

        statusText.innerText = "SISTEMA ACTIVO";
        hablar("Sistema listo. Escaneando el camino.");

        // Bucle de procesamiento en tiempo real
        procesarCamara();
      } catch (err) {
        statusText.innerText = "Error de inicio: " + err.message;
        hablar("Error al iniciar el sistema");
        console.error(err);
      }
    }

    async function procesarCamara() {
      if (!session) return;

      // Dibujar frame actual en canvas para procesar datos
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // Preprocesamiento básico (Redimensionar y normalizar a 640x640)
      const inputTensor = prepararTensor(video);
      
      // Inferencia con ONNX en el procesador del teléfono
      const feeds = {};
      feeds[session.inputNames[0]] = inputTensor;
      const results = await session.run(feeds);
      
      // Output0 de YOLOv8
      const output = results[session.outputNames[0]].data;
      
      // Post-procesamiento y detección de distancias
      analizarDetecciones(output);

      // Siguiente fotograma
      requestAnimationFrame(procesarCamara);
    }

    function prepararTensor(imageSource) {
      // Crear un canvas temporal de 640x640 para YOLOv8
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = 640;
      tempCanvas.height = 640;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(imageSource, 0, 0, 640, 640);

      const imgData = tempCtx.getImageData(0, 0, 640, 640).data;
      const float32Data = new Float32Array(1 * 3 * 640 * 640);

      // Normalizar imagen (RGB de 0-255 a 0.0-1.0)
      for (let i = 0; i < 640 * 640; i++) {
        float32Data[i] = imgData[i * 4] / 255.0;                   // R
        float32Data[i + 640 * 640] = imgData[i * 4 + 1] / 255.0;     // G
        float32Data[i + 2 * 640 * 640] = imgData[i * 4 + 2] / 255.0; // B
      }

      return new ort.Tensor('float32', float32Data, [1, 3, 640, 640]);
    }

    function analizarDetecciones(output) {
      // output viene en formato (1, 84, 8400)
      const numPredictions = 8400;
      let objetoMasCercano = null;
      let maxArea = 0;

      for (let i = 0; i < numPredictions; i++) {
        // Encontrar la clase con mayor confianza
        let maxScore = 0;
        let classId = -1;

        for (let c = 0; c < 80; c++) {
          const score = output[(4 + c) * numPredictions + i];
          if (score > maxScore) {
            maxScore = score;
            classId = c;
          }
        }

        // Si supera el umbral de confianza y es una clase útil para peatones
        if (maxScore > 0.45 && classNames[classId]) {
          const w = output[2 * numPredictions + i];
          const h = output[3 * numPredictions + i];
          const area = w * h; // El área refleja la proximidad del objeto

          if (area > maxArea) {
            maxArea = area;
            objetoMasCercano = {
              nombre: classNames[classId],
              area: area,
              cx: output[0 * numPredictions + i]
            };
          }
        }
      }

      // Si detecta un objeto cercano, avisar por voz con posición
      if (objetoMasCercano && maxArea > 15000) { // Umbral de proximidad
        let posicion = "al frente";
        if (objetoMasCercano.cx < 210) posicion = "a la izquierda";
        else if (objetoMasCercano.cx > 430) posicion = "a la derecha";

        hablar(`${objetoMasCercano.nombre} ${posicion}`);
      }
    }
  </script>
</body>
</html>
