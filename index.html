<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copiloto - Asistente Visual</title>
  <!-- Carga de ONNX Runtime Web desde CDN -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    
    #video-container {
      position: relative;
      width: 100vw;
      height: 70vh;
      overflow: hidden;
      background-color: #1a1a1a;
    }
    
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    canvas {
      display: none;
    }
    
    #controls {
      height: 30vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 20px;
      background-color: #0a0a0a;
    }
    
    button {
      width: 90%;
      max-width: 400px;
      height: 70px;
      font-size: 1.2rem;
      font-weight: bold;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    
    button:hover:not(:disabled) {
      background-color: #218838;
    }
    
    button:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }
    
    #status {
      font-size: 1.2rem;
      color: #ffc107;
      min-height: 30px;
      font-weight: bold;
    }
    
    #detection-log {
      font-size: 0.9rem;
      color: #87ceeb;
      max-height: 80px;
      overflow-y: auto;
      width: 90%;
      max-width: 400px;
      background-color: #1a1a1a;
      padding: 10px;
      border-radius: 5px;
      text-align: left;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output-canvas"></canvas>
  </div>

  <div id="controls">
    <div id="status">Inicializando...</div>
    <button id="btn-start" onclick="iniciarCopiloto()">INICIAR</button>
    <button id="btn-stop" onclick="detenerCopiloto()" disabled>DETENER</button>
    <div id="detection-log"></div>
  </div>

  <script>
    let session = null;
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output-canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    const detectionLog = document.getElementById('detection-log');
    const btnStart = document.getElementById('btn-start');
    const btnStop = document.getElementById('btn-stop');
    
    let lastSpokenTime = 0;
    let lastSpokenText = "";
    let isRunning = false;
    let frameCount = 0;
    let processingFrame = false;
    let lastDetectionTime = 0;
    let totalDetections = 0;

    // Nombres de clases COCO en español (80 clases)
    const classNames = [
      'persona', 'bicicleta', 'coche', 'moto', 'autobús',
      'tren', 'camión', 'bote', 'semáforo', 'boca de riego',
      'señal de stop', 'parquímetro', 'banco', 'pájaro', 'gato',
      'perro', 'caballo', 'oveja', 'vaca', 'elefante',
      'oso', 'cebra', 'jirafa', 'mochila', 'paraguas',
      'bolsa', 'corbata', 'maleta', 'disco volador', 'esquís',
      'tabla de esquí', 'tabla de deportes acuáticos', 'tabla de surf', 'botella de tenis', 'taza',
      'tenedor', 'cuchillo', 'cuchara', 'cuenco', 'plátano',
      'manzana', 'sándwich', 'naranja', 'brócoli', 'zanahoria',
      'perrito caliente', 'pizza', 'donut', 'pastel', 'silla',
      'sofá', 'planta en maceta', 'cama', 'mesa de comedor', 'váter',
      'televisión', 'portátil', 'ratón', 'teclado', 'microondas',
      'horno', 'tostadora', 'fregadero', 'refrigerador', 'libro',
      'reloj', 'florero', 'tijeras', 'oso de peluche', 'secador de pelo',
      'cepillo de dientes', 'monopatín', 'pelota de surf', 'muñeca de acción', 'piscina'
    ];

    // Síntesis de voz
    function hablar(texto) {
      const now = Date.now();
      if (texto === lastSpokenText && (now - lastSpokenTime) < 2000) return;

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = 'es-ES';
      utterance.rate = 1.0;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);

      lastSpokenText = texto;
      lastSpokenTime = now;
    }

    // Actualizar log de detecciones
    function actualizarLog(texto) {
      const timestamp = new Date().toLocaleTimeString();
      const logEntry = document.createElement('div');
      logEntry.innerHTML = `${timestamp}: ${texto}`;
      detectionLog.insertBefore(logEntry, detectionLog.firstChild);
      
      // Mantener solo los últimos 5
      while (detectionLog.children.length > 5) {
        detectionLog.removeChild(detectionLog.lastChild);
      }
    }

    async function iniciarCopiloto() {
      if (isRunning) return;
      
      statusText.innerText = "Iniciando cámara...";
      hablar("Iniciando copiloto visual");
      btnStart.disabled = true;

      try {
        // Acceder a la cámara
        const constraints = {
          video: { 
            facingMode: { ideal: "environment" },
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints)
          .catch(() => navigator.mediaDevices.getUserMedia({ video: true, audio: false }));
        
        video.srcObject = stream;
        
        // Esperar a que el video esté listo
        await new Promise((resolve) => {
          const checkVideo = () => {
            if (video.videoWidth > 0) {
              video.play();
              resolve();
            } else {
              setTimeout(checkVideo, 100);
            }
          };
          setTimeout(resolve, 3000); // Timeout de seguridad
          checkVideo();
        });

        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;

        statusText.innerText = "Cargando modelo IA...";
        actualizarLog("Cargando modelo YOLOv8...");
        
        // Cargar modelo ONNX
        try {
          session = await ort.InferenceSession.create('./yolov8n.onnx', {
            executionProviders: ['wasm'],
          });

          console.log("Modelo cargado. Nombres entrada:", session.inputNames);
          console.log("Nombres salida:", session.outputNames);

          isRunning = true;
          frameCount = 0;
          totalDetections = 0;
          statusText.innerText = "✓ SISTEMA ACTIVO";
          hablar("Sistema listo, escaneando el camino");
          btnStop.disabled = false;
          actualizarLog("Modelo listo. Iniciando detección...");

          // Iniciar procesamiento
          procesarCamara();
        } catch (modelErr) {
          statusText.innerText = "Error modelo: " + modelErr.message;
          console.error("Error modelo:", modelErr);
          actualizarLog("Error al cargar modelo");
          btnStart.disabled = false;
        }
      } catch (err) {
        statusText.innerText = "Error: " + err.message;
        console.error("Error:", err);
        actualizarLog("Error: " + err.message.substring(0, 40));
        btnStart.disabled = false;
      }
    }

    function detenerCopiloto() {
      isRunning = false;
      if (session) {
        session.release?.();
        session = null;
      }
      statusText.innerText = "Detenido";
      btnStart.disabled = false;
      btnStop.disabled = true;
      
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }
      
      hablar("Copiloto detenido");
      actualizarLog(`Sistema detenido. Total detecciones: ${totalDetections}`);
    }

    async function procesarCamara() {
      if (!isRunning || !session || processingFrame) {
        requestAnimationFrame(procesarCamara);
        return;
      }

      processingFrame = true;

      try {
        // Procesar cada 2 frames (más rápido)
        frameCount++;
        if (frameCount % 2 !== 0) {
          processingFrame = false;
          requestAnimationFrame(procesarCamara);
          return;
        }

        // Dibujar video en canvas
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // Preparar tensor
        const inputTensor = prepararTensor();
        if (!inputTensor) throw new Error("No se pudo crear tensor");
        
        // Inferencia
        const feeds = {};
        feeds[session.inputNames[0]] = inputTensor;
        
        const results = await session.run(feeds);
        
        // Procesar resultados
        if (results && session.outputNames && session.outputNames[0]) {
          const output = results[session.outputNames[0]];
          if (output && output.data) {
            analizarDetecciones(output.data, output.dims);
          }
        }

        // Liberar memoria
        inputTensor.dispose();

      } catch (err) {
        console.error("Error procesamiento frame", frameCount, ":", err);
        if (frameCount % 30 === 0) {
          actualizarLog("Error proc: " + err.message.substring(0, 25));
        }
      } finally {
        processingFrame = false;
        requestAnimationFrame(procesarCamara);
      }
    }

    function prepararTensor() {
      try {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = 640;
        tempCanvas.height = 640;
        const tempCtx = tempCanvas.getContext('2d');
        
        // Dibujar video escalado
        tempCtx.drawImage(video, 0, 0, 640, 640);
        
        const imgData = tempCtx.getImageData(0, 0, 640, 640).data;
        const float32Data = new Float32Array(640 * 640 * 3);

        // Normalizar imagen RGB (0-255 -> 0-1)
        for (let i = 0; i < 640 * 640; i++) {
          float32Data[i] = imgData[i * 4] / 255.0;                          // R
          float32Data[i + 640 * 640] = imgData[i * 4 + 1] / 255.0;          // G
          float32Data[i + 2 * 640 * 640] = imgData[i * 4 + 2] / 255.0;      // B
        }

        return new ort.Tensor('float32', float32Data, [1, 3, 640, 640]);
      } catch (err) {
        console.error("Error preparando tensor:", err);
        return null;
      }
    }

    function analizarDetecciones(output, dims) {
      try {
        // YOLOv8 output: [1, 8400, 84]
        // 84 = 4 (x,y,w,h) + 80 (clases)
        
        if (!dims || dims.length < 3) {
          console.error("Dimensiones inesperadas:", dims);
          return;
        }

        const numPredictions = dims[1] || 8400;
        const numValues = dims[2] || 84;
        const numClasses = Math.min(numValues - 4, 80);

        let detectadas = [];
        let debugCount = 0;

        for (let i = 0; i < numPredictions; i++) {
          const baseIdx = i * numValues;
          
          // Extraer coordenadas
          const x = output[baseIdx] || 0;
          const y = output[baseIdx + 1] || 0;
          const w = output[baseIdx + 2] || 0;
          const h = output[baseIdx + 3] || 0;

          // Buscar clase con máxima confianza
          let maxScore = 0;
          let classId = -1;

          for (let c = 0; c < numClasses; c++) {
            const score = output[baseIdx + 4 + c] || 0;
            if (score > maxScore) {
              maxScore = score;
              classId = c;
            }
          }

          // Si supera umbral y es una clase válida
          if (maxScore > 0.35 && classId >= 0 && classId < classNames.length) {
            const area = w * h;

            if (area > 0.0001) { // Área mínima muy pequeña (normalizada)
              detectadas.push({
                nombre: classNames[classId],
                confianza: (maxScore * 100).toFixed(1),
                x: x,
                y: y,
                w: w,
                h: h,
                area: area
              });

              if (debugCount < 3) {
                console.log(`Detección ${i}: ${classNames[classId]} (${(maxScore*100).toFixed(1)}%) area=${area.toFixed(4)}`);
                debugCount++;
              }
            }
          }
        }

        // Procesar detecciones ordenadas por área (proximidad)
        detectadas.sort((a, b) => b.area - a.area);
        
        if (detectadas.length > 0 && frameCount % 15 === 0) {
          console.log(`Total detecciones en frame ${frameCount}: ${detectadas.length}`);
        }

        if (detectadas.length > 0) {
          const obj = detectadas[0];
          const now = Date.now();
          
          // Umbral muy bajo para avisar
          if (obj.area > 0.001 && (now - lastDetectionTime) > 1500) {
            let posicion = "al frente";
            if (obj.x < 0.33) posicion = "a la izquierda";
            else if (obj.x > 0.67) posicion = "a la derecha";

            const mensaje = `${obj.nombre} ${posicion}`;
            hablar(mensaje);
            actualizarLog(`✓ ${obj.nombre} ${posicion} (${obj.confianza}%)`);
            lastDetectionTime = now;
            totalDetections++;
          }
        }
      } catch (err) {
        console.error("Error analizando detecciones:", err);
      }
    }

    // Inicializar estado
    statusText.innerText = "Listo. Presiona INICIAR";
  </script>
</body>
</html>
